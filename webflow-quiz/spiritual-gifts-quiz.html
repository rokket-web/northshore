<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiritual Gifts &amp; Volunteer Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231F20;
  --ink-soft:#373743;
  --paper:#F7F7F7;
  --paper-raised:#FFFFFF;
  --line:#D6D6D6;
  --gold:#D78A5C;
  --gold-deep:#B96C3E;
  --teal:#3A7596;
  --teal-deep:#2A5871;
  --plum:#373743;
  --danger:#B4543A;
  --radius:14px;
  --font-header:'Proxima Nova','Montserrat',system-ui,-apple-system,sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Proxima Nova','Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  line-height:1.5;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.eyebrow{
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-deep);
  font-weight:700;
  margin:0 0 8px;
}
h1,h2,h3{font-weight:600;margin:0 0 10px;color:var(--ink)}
h1{font-family:var(--font-header);font-weight:700;font-size:32px;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:25px}
h3{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:19px}
p{margin:0 0 14px;color:var(--ink-soft)}
.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:16px;
}
.progress-track{
  height:6px;
  background:var(--line);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:22px;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--teal));
  transition:width .35s ease;
}
.step-label{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
}
.q{
  border-top:1px solid var(--line);
  padding:16px 0;
}
.q:first-child{border-top:none;padding-top:0}
.q-text{font-weight:600;margin-bottom:10px;font-size:15.5px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{
  flex:1;
  min-width:64px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 4px;
  font-size:12px;
  cursor:pointer;
  color:var(--ink-soft);
  background:#FDFCFA;
  transition:.15s;
}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:hover{border-color:var(--gold)}
.scale input:checked + label{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}
.pair{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.pair-opt{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  font-size:14.5px;
  background:#FDFCFA;
  transition:.15s;
}
.pair-opt:hover{border-color:var(--gold)}
.pair-opt.sel{
  background:var(--teal-deep);
  border-color:var(--teal-deep);
  color:#fff;
}
.check-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:8px;
}
.check-item{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
  font-size:14px;
  background:#FDFCFA;
}
.check-item.sel{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  font-weight:600;
}
.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
button{
  font-family:var(--font-body);
  font-size:14.5px;
  font-weight:600;
  border-radius:999px;
  padding:12px 22px;
  border:none;
  cursor:pointer;
  transition:.15s;
}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--teal-deep)}
.btn-primary:disabled{background:#C9C4B8;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
input[type=text],input[type=email]{
  width:100%;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  font-family:var(--font-body);
  font-size:14.5px;
  background:#FDFCFA;
  margin-bottom:8px;
  display:block;
}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:0;margin-bottom:14px}
.badge{
  display:inline-block;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:999px;
  background:var(--teal);
  color:#fff;
  margin-right:6px;
}
.gift-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.gift-name{width:130px;font-size:13.5px;font-weight:600;flex-shrink:0}
.gift-bar-track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.gift-bar-fill{height:100%;border-radius:6px}
.gift-pct{width:38px;text-align:right;font-size:12.5px;color:var(--ink-soft)}
.role-card{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:12px;
  background:#FDFCFA;
  position:relative;
}
.role-rank{
  position:absolute;
  top:-10px;left:18px;
  background:var(--gold);
  color:#fff;
  font-family:var(--font-display);
  font-size:13px;
  font-weight:700;
  padding:3px 11px;
  border-radius:999px;
}
.role-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:6px 0 4px}
.role-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:10px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11.5px;
  padding:3px 9px;
  border-radius:999px;
  background:#EFEAE0;
  color:var(--ink-soft);
}
.tag.match{background:var(--teal);color:#fff}
.match-pct{
  position:absolute;
  top:16px;right:20px;
  font-family:var(--font-display);
  font-size:22px;
  font-weight:700;
  color:var(--gold-deep);
}
.center{text-align:center}
.small{font-size:12.5px;color:var(--ink-soft)}
.divider{height:1px;background:var(--line);margin:22px 0}
a{color:var(--teal-deep)}
.type-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--ink);
  color:#fff;
  padding:10px 16px;
  border-radius:12px;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  margin-bottom:6px;
}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"questions": [{"id": 1, "text": "I know how to say the right encouraging word at exactly the right moment.", "gift": "Exhortation"}, {"id": 2, "text": "I can stay confident in God's provision even when the odds look bad.", "gift": "Faith"}, {"id": 3, "text": "I feel compelled to speak up when something isn't lining up with truth, even if it's uncomfortable.", "gift": "Prophecy"}, {"id": 4, "text": "I can usually tell when someone's words and their motives don't quite line up.", "gift": "Discernment"}, {"id": 5, "text": "I get genuine joy from giving generously, especially when it requires sacrifice.", "gift": "Giving"}, {"id": 6, "text": "I look for natural openings to bring up my faith in everyday conversations.", "gift": "Evangelism"}, {"id": 7, "text": "I notice practical needs before anyone has to ask me to help.", "gift": "Helps"}, {"id": 8, "text": "I like walking with the same group of people over a long period of time.", "gift": "Shepherding"}, {"id": 9, "text": "I like breaking a big project into clear, manageable steps.", "gift": "Administration"}, {"id": 10, "text": "I enjoy researching a topic thoroughly before I explain it to others.", "gift": "Teaching"}, {"id": 11, "text": "I'm naturally drawn toward people who are hurting or overlooked.", "gift": "Mercy"}, {"id": 12, "text": "I go out of my way to make a newcomer feel like they belong.", "gift": "Hospitality"}, {"id": 13, "text": "In a tense situation, I can usually see the wise next step when others are stuck.", "gift": "Wisdom"}, {"id": 14, "text": "I'm drawn to starting something new rather than maintaining something established.", "gift": "Apostleship"}, {"id": 15, "text": "I can rally a group around a shared goal and keep them moving toward it.", "gift": "Leadership"}, {"id": 16, "text": "I love digging deep into a topic long after most people have moved on.", "gift": "Knowledge"}, {"id": 17, "text": "I can identify sin or compromise that others have grown used to overlooking.", "gift": "Prophecy"}, {"id": 18, "text": "I notice when a system is inefficient and enjoy fixing it.", "gift": "Administration"}, {"id": 19, "text": "I can sit with someone in pain without rushing them to feel better.", "gift": "Mercy"}, {"id": 20, "text": "I'd rather work quietly in the background than be recognized up front.", "gift": "Helps"}, {"id": 21, "text": "I can take a complicated idea and make it simple to understand.", "gift": "Teaching"}, {"id": 22, "text": "People ask for my perspective when they're facing a hard decision.", "gift": "Wisdom"}, {"id": 23, "text": "Opening my home to others feels natural to me, not like a burden.", "gift": "Hospitality"}, {"id": 24, "text": "I feel energized, not anxious, about talking to someone who doesn't know Christ.", "gift": "Evangelism"}, {"id": 25, "text": "I sense when something is spiritually \u201coff\u201d even before I can explain why.", "gift": "Discernment"}, {"id": 26, "text": "I adapt quickly to unfamiliar cultures or environments.", "gift": "Apostleship"}, {"id": 27, "text": "I look for financial needs I can quietly meet without recognition.", "gift": "Giving"}, {"id": 28, "text": "When a team lacks direction, I naturally step in to provide it.", "gift": "Leadership"}, {"id": 29, "text": "I'm willing to commit to something before I can see how it will work out.", "gift": "Faith"}, {"id": 30, "text": "I feel responsible for the spiritual health of people close to me.", "gift": "Shepherding"}, {"id": 31, "text": "I look for practical next steps to offer someone who feels stuck.", "gift": "Exhortation"}, {"id": 32, "text": "I often uncover insights in Scripture that others miss.", "gift": "Knowledge"}, {"id": 33, "text": "I feel genuine satisfaction doing routine tasks that free others up for their calling.", "gift": "Helps"}, {"id": 34, "text": "I'm drawn to people who are discouraged and want to help them move forward.", "gift": "Exhortation"}, {"id": 35, "text": "I enjoy casting a vision for the future and helping others buy into it.", "gift": "Leadership"}, {"id": 36, "text": "I feel a pull toward reaching people who have little or no access to the gospel.", "gift": "Apostleship"}, {"id": 37, "text": "I manage my resources carefully so I can give more, not just save more.", "gift": "Giving"}, {"id": 38, "text": "I notice when someone has quietly drifted and want to check in on them.", "gift": "Shepherding"}, {"id": 39, "text": "I feel others' pain almost as if it were my own.", "gift": "Mercy"}, {"id": 40, "text": "I inspire others to trust God more when I share my own confidence in Him.", "gift": "Faith"}, {"id": 41, "text": "Other people ask me to help them figure out if a teaching or claim is trustworthy.", "gift": "Discernment"}, {"id": 42, "text": "I notice who's standing alone and make a point to include them.", "gift": "Hospitality"}, {"id": 43, "text": "I keep track of details that others tend to overlook.", "gift": "Administration"}, {"id": 44, "text": "I'm willing to say a hard thing if I believe it will lead to repentance.", "gift": "Prophecy"}, {"id": 45, "text": "I look forward to opportunities to lead a class or Bible study.", "gift": "Teaching"}, {"id": 46, "text": "I can apply a biblical principle to a very specific, real-life problem.", "gift": "Wisdom"}, {"id": 47, "text": "I can explain the gospel simply, in a way a total stranger could follow.", "gift": "Evangelism"}, {"id": 48, "text": "People come to me when they want a well-researched answer, not just an opinion.", "gift": "Knowledge"}, {"id": 49, "text": "I notice when a teacher or speaker has misrepresented what Scripture actually says.", "gift": "Teaching"}, {"id": 50, "text": "I actively build friendships with people outside the church so I can share my faith.", "gift": "Evangelism"}, {"id": 51, "text": "I can motivate someone to keep going without minimizing what they're facing.", "gift": "Exhortation"}, {"id": 52, "text": "I look for small, tangible ways to make someone else's job easier.", "gift": "Helps"}, {"id": 53, "text": "I go out of my way to comfort people going through a hard season.", "gift": "Mercy"}, {"id": 54, "text": "I take responsibility for outcomes, even when things get difficult.", "gift": "Leadership"}, {"id": 55, "text": "I'd rather pioneer a new ministry than manage an existing one.", "gift": "Apostleship"}, {"id": 56, "text": "I enjoy creating an environment where people feel instantly comfortable.", "gift": "Hospitality"}, {"id": 57, "text": "I sense when a group or individual needs a direct word of correction, not just comfort.", "gift": "Prophecy"}, {"id": 58, "text": "Uncertainty doesn't shake my conviction that God will come through.", "gift": "Faith"}, {"id": 59, "text": "I tend to see the long-term consequences of a choice before others do.", "gift": "Wisdom"}, {"id": 60, "text": "I enjoy providing steady, long-term guidance rather than a one-time fix.", "gift": "Shepherding"}, {"id": 61, "text": "I'm the one people count on to keep an event or project on schedule.", "gift": "Administration"}, {"id": 62, "text": "I can spot the difference between godly counsel and counsel that only sounds good.", "gift": "Discernment"}, {"id": 63, "text": "I feel prompted to give beyond what's expected when I see a real need.", "gift": "Giving"}, {"id": 64, "text": "I enjoy organizing facts and information into something useful for others.", "gift": "Knowledge"}, {"id": 65, "text": "I can read a room and adjust my approach to bring out the best in each person.", "gift": "Leadership"}, {"id": 66, "text": "I enjoy coaching people through a challenge until they come out stronger.", "gift": "Exhortation"}, {"id": 67, "text": "People trust me to watch out for them.", "gift": "Shepherding"}, {"id": 68, "text": "I'm drawn to bold, faith-stretching opportunities rather than safe ones.", "gift": "Faith"}, {"id": 69, "text": "I like helping someone understand not just what to believe, but why.", "gift": "Teaching"}, {"id": 70, "text": "I have a strong conviction that truth needs to be spoken plainly.", "gift": "Prophecy"}, {"id": 71, "text": "I bring up spiritual topics more often than most people around me.", "gift": "Evangelism"}, {"id": 72, "text": "I can bring clarity to a confusing situation without oversimplifying it.", "gift": "Wisdom"}, {"id": 73, "text": "I notice red flags in situations that others tend to miss.", "gift": "Discernment"}, {"id": 74, "text": "I find satisfaction in creating order out of a chaotic situation.", "gift": "Administration"}, {"id": 75, "text": "I retain and recall biblical details that help clarify a discussion.", "gift": "Knowledge"}], "giftDefs": {"Leadership": "The capacity to cast vision, motivate people, and direct a group toward a shared goal so the church moves forward with unity and purpose. People with this gift naturally take responsibility, keep others aligned to what matters most, and help a team accomplish more together than any one person could alone. (Romans 12:8; Hebrews 13:7)", "Administration": "The capacity to turn a vision into a workable plan \u2014 organizing people, time, and resources so a ministry actually gets done. Those with this gift bring order out of complexity, keep projects on track, and free others to focus on their part of the work. (1 Corinthians 12:28; Titus 1:5)", "Teaching": "The capacity to study, understand, and clearly explain the truths of Scripture so others grow in knowledge and obedience. Teachers care as much about accuracy as they do about making a truth land \u2014 they want people to understand not just what the Bible says, but why it matters. (Romans 12:7; Ephesians 4:11; Hebrews 5:12-14)", "Knowledge": "The capacity to search out and retain the deeper truths of God's Word, often uncovering insights that serve the whole church. This gift shows up as a hunger to study long after curiosity alone would quit, and a desire to organize what's learned into something others can use. (1 Corinthians 12:8; Ephesians 3:14-19)", "Wisdom": "The capacity to apply spiritual truth to a specific, real situation \u2014 seeing not just what's true in general, but what's needed right now. People with this gift bring clarity to conflict and confusion, and others often seek them out before making a hard decision. (1 Corinthians 12:8; James 3:13-17)", "Prophecy": "The capacity to speak God's truth boldly and plainly, even when it exposes sin or challenges comfortable assumptions. This gift builds up the church by calling it back to what's true, often through direct correction, timely warning, or a willingness to say the hard thing others avoid. (Romans 12:6; 1 Corinthians 14:3-5)", "Discernment": "The capacity to distinguish truth from error and to sense whether a teaching, message, or motive is trustworthy. Those with this gift protect the church by noticing what others miss \u2014 inconsistencies, hidden motives, or spiritual compromise dressed up as something good. (1 Corinthians 12:10; 1 John 4:1-6)", "Exhortation": "The capacity to strengthen and motivate people toward action, offering practical next steps rather than just sympathy. Exhorters are natural encouragers and coaches \u2014 they help discouraged people find their footing and keep moving forward in faith. (Romans 12:8; Acts 11:23-24)", "Shepherding": "The capacity to walk with a person or group over the long haul, providing steady spiritual care, protection, and direction. This gift isn't limited to pastors \u2014 anyone who has it feels a real sense of responsibility for the spiritual wellbeing of the people entrusted to them. (Ephesians 4:11; 1 Peter 5:1-11)", "Faith": "The capacity to trust God's promises and provision with unusual confidence, especially when circumstances offer no guarantee of success. People with this gift inspire others to believe God for more, and they're often the first to move forward when everyone else sees only obstacles. (1 Corinthians 12:9; Hebrews 11)", "Evangelism": "The capacity to communicate the gospel clearly and naturally so that people respond in faith. Evangelists feel energized rather than anxious about spiritual conversations with strangers, and they actively look for opportunities to introduce people to Christ. (Ephesians 4:11; Acts 8:26-40)", "Apostleship": "The capacity to start new ministries or churches and adapt well to unfamiliar cultures and environments. Those with this gift are drawn to pioneering rather than maintaining, and they carry a strong desire to reach people who have little or no access to the gospel. (1 Corinthians 12:28; Romans 15:20)", "Helps": "The capacity to notice practical needs and meet them, often without being asked and without needing recognition. This gift finds real satisfaction in routine, behind-the-scenes tasks that free other people to do what God has called them to do. (1 Corinthians 12:28; Acts 6:1-7)", "Mercy": "The capacity to feel genuine compassion for people who are hurting and to act on that compassion cheerfully, even in difficult circumstances. Those with this gift are drawn to the overlooked and suffering, and they have an unusual ability to sit with pain without rushing past it. (Romans 12:8; Luke 10:30-37)", "Giving": "The capacity to give financial and material resources generously, cheerfully, and often sacrificially to further God's work. People with this gift tend to manage their resources carefully specifically so they can give more, and they find real joy in meeting a need quietly. (Romans 12:8; 2 Corinthians 8:1-5)", "Hospitality": "The capacity to make guests, newcomers, and strangers feel genuinely welcome and at ease. This gift often shows up as an open home and an instinct for noticing who's standing alone \u2014 hospitality turns a room of strangers into a room of belonging. (1 Peter 4:9; Genesis 18:1-15)"}, "roles": [{"team": "Alpha Food Team", "desc": "Help with setup or providing dinner & dessert at one of the Alpha nights.", "schedule": ["Tuesday Nights", "Inconsistent Schedule"], "faith": ["New to Faith"], "created": ["Organized", "Prefer behind the scenes"], "skills": ["Cooking"], "gifts": ["Leadership", "Helps", "Hospitality"]}, {"team": "Alpha Host and Helpers", "desc": "Serve in Alpha creating welcoming spaces for guests at tables", "schedule": [], "faith": ["New to Faith"], "created": ["Love people", "Technically minded"], "skills": [], "gifts": []}, {"team": "Care Team", "desc": "Help facilitate Care Groups or offer one-to-one support for those experiencing challenges in life.", "schedule": ["Tuesday Nights", "During Office Hours", "WeekDay Evenings", "Inconsistent Schedule", "Own Time"], "faith": ["Served in a Church Before?"], "created": ["Love people", "Prefer behind the scenes", "Logistically minded"], "skills": ["Counseling Training"], "gifts": ["Discernment", "Exhortation", "Shepherding", "Faith", "Mercy"]}, {"team": "Baptism Backstage Support", "desc": "Assist backstage during baptisms and experience the excitement of those who are getting baptized. Easter Sunday especially.", "schedule": ["Early Sunday Morning", "Sunday Services", "Inconsistent Schedule"], "faith": ["New to Faith"], "created": ["Love people", "Prefer behind the scenes", "Logistically minded"], "skills": [], "gifts": ["Apostleship", "Helps", "Mercy", "Hospitality"]}, {"team": "Prayer Room", "desc": "Help design and set up special prayer spaces and experiences on campus", "schedule": ["WeekDay Evenings", "Inconsistent Schedule", "Own Time"], "faith": ["Served in a Church Before?"], "created": ["Prefer behind the scenes", "Logistically minded"], "skills": ["Creative"], "gifts": ["Exhortation", "Faith", "Mercy"]}, {"team": "Prayer Team", "desc": "Praying with those seeking prayer after services. Receiving and praying over requests submitted in weekend services or online.", "schedule": ["WeekDay Evenings", "Own Time"], "faith": ["Served in a Church Before?"], "created": ["Love people"], "skills": [], "gifts": ["Prophecy", "Exhortation", "Faith", "Mercy", "Hospitality"]}, {"team": };

function progressPct(){

/* ===================== SCORING ===================== */
function computeGiftScores(){
  const sums = {}, counts = {};
  DATA.giftOrder.forEach(g => { sums[g] = 0; counts[g] = 0; });
  DATA.questions.forEach(q => {
    const v = S.answers[q.id] || 0;
    sums[q.gift] += v;
    counts[q.gift] += 1;
  });
  // Each item is scored 1-5. Normalize per gift using that gift's own question count,
  // so gifts with 4 vs 5 questions are still compared fairly (0-1 scale).
  const norm = {};
  DATA.giftOrder.forEach(g => {
    const n = counts[g] || 1;
    const min = n * 1, max = n * 5;
    norm[g] = Math.max(0, Math.min(1, (sums[g] - min) / (max - min)));
  });
  return {sums, norm, counts};
}

function computeDiscCounts(){
  const c = {D:0,I:0,S:0,C:0};
  DATA.discPairs.forEach(p => {
    const pick = S.disc[p.id];
    if (!pick) return;
    const opt = pick === 'a' ? p.a : p.b;
    c[opt.k]++;
  });
  return c;
}

function computeMbtiCounts(){
  const c = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  DATA.mbtiPairs.forEach(p => {
    const pick = S.mbti[p.id];
    if (!pick) return;
    const opt = pick === 'a' ? p.a : p.b;
    c[opt.k]++;
  });
  return c;
}

function computeCreatedScores(){
  const disc = computeDiscCounts();
  const mbti = computeMbtiCounts();
  const dNorm = k => disc[k] / 4;
  const mNorm = k => mbti[k] / 2;
  const clamp = v => Math.max(0, Math.min(1, v));
  return {
    "Organized": clamp((dNorm('C') + mNorm('J')) / 2),
    "Love people": clamp((dNorm('I') + dNorm('S') + mNorm('F')) / 3),
    "Prefer behind the scenes": clamp((dNorm('S') + dNorm('C') + mNorm('I')) / 3),
    "Technically minded": clamp((dNorm('C') + mNorm('T')) / 2),
    "Logistically minded": clamp((dNorm('C') + mNorm('J') + mNorm('T')) / 3),
  };
}

function discPrimary(){
  const c = computeDiscCounts();
  let best = 'D', bv = -1;
  Object.entries(c).forEach(([k,v]) => { if (v > bv) { bv = v; best = k; } });
  return {letter: best, counts: c};
}

function mbtiType(){
  const c = computeMbtiCounts();
  const type = (c.E >= c.I ? 'E' : 'I') + (c.S >= c.N ? 'S' : 'N') + (c.T >= c.F ? 'T' : 'F') + (c.J >= c.P ? 'J' : 'P');
  return type;
}

function topGifts(norm, n){
  return DATA.giftOrder.slice().sort((a,b) => norm[b]-norm[a]).slice(0,n);
}

function scoreRole(role, ctx){
  const {giftNorm, created, schedule, skills, faithStory, under18} = ctx;
  const matched = {gifts:[], skills:[], schedule:[], created:[], faith:[]};

  // Special skills — 30%
  let skillScore = 0.5;
  if (role.skills.length) {
    const hits = role.skills.filter(s => skills.has(s));
    matched.skills = hits;
    skillScore = hits.length / role.skills.length;
  }

  // How You're Created — 25%
  let createdScore = 0.5;
  if (role.created.length) {
    let sum = 0;
    role.created.forEach(t => {
      let v;
      if (t === 'Under 18') {
        v = under18 === 'yes' ? 1 : 0;
      } else {
        v = created[t] !== undefined ? created[t] : 0;
      }
      if (v > 0.55) matched.created.push(t);
      sum += v;
    });
    createdScore = sum / role.created.length;
  }

  // Schedule — 25%
  let scheduleScore = 0.5;
  if (role.schedule.length) {
    if (schedule.has('Own Time')) {
      scheduleScore = 1;
      matched.schedule = role.schedule.slice();
    } else {
      const hits = role.schedule.filter(s => schedule.has(s));
      matched.schedule = hits;
      scheduleScore = hits.length / role.schedule.length;
    }
  }

  // Faith Story — 5%
  let faithScore = 0.5;
  if (role.faith.length) {
    const hits = role.faith.filter(f => faithStory.has(f));
    matched.faith = hits;
    faithScore = hits.length / role.faith.length;
  }

  // Gifts — 15%
  let giftScore = 0.5;
  if (role.gifts.length) {
    let sum = 0;
    role.gifts.forEach(g => {
      const v = giftNorm[g] || 0;
      if (v > 0.55) matched.gifts.push(g);
      sum += v;
    });
    giftScore = sum / role.gifts.length;
  }

  const score = (WEIGHTS.skills * skillScore) + (WEIGHTS.created * createdScore) +
    (WEIGHTS.schedule * scheduleScore) + (WEIGHTS.faith * faithScore) + (WEIGHTS.gifts * giftScore);

  return {score, matched};
}

function computeMatches(){
  const {norm} = computeGiftScores();
  const created = computeCreatedScores();
  const ctx = {
    giftNorm: norm,
    created,
    schedule: S.schedule,
    skills: S.skills,
    faithStory: S.faithStory,
    under18: S.under18,
  };
  const scored = DATA.roles.map(r => {
    const {score, matched} = scoreRole(r, ctx);
    return {role:r, score, matched};
  });
  scored.sort((a,b) => b.score - a.score);
  return scored;
}

/* ===================== RENDER: RESULTS ===================== */
function radarSvg(norm){
  const N = DATA.giftOrder.length;
  const R = 120, cx = 150, cy = 150;
  const pts = DATA.giftOrder.map((g, i) => {
    const angle = (Math.PI * 2 * i / N) - Math.PI/2;
    const r = 18 + norm[g]*R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  const poly = pts.map(p => p.join(',')).join(' ');
  const rings = [0.25,0.5,0.75,1].map(f => {
    const rr = 18 + f*R;
    return `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#DED7C6" stroke-width="1"/>`;
  }).join('');
  const spokes = DATA.giftOrder.map((g,i) => {
    const angle = (Math.PI*2*i/N) - Math.PI/2;
    const x2 = cx + (18+R)*Math.cos(angle), y2 = cy + (18+R)*Math.sin(angle);
    return `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#DED7C6" stroke-width="1"/>`;
  }).join('');
  return `<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;display:block;margin:0 auto">
    ${rings}${spokes}
    <polygon points="${poly}" fill="#C1892E" fill-opacity="0.28" stroke="#96691E" stroke-width="2"/>
  </svg>`;
}

/* ===================== BACKEND SUBMISSION ===================== */
// Sends the current results to the Render app, which generates a PDF, saves it to
// SharePoint, updates the person's Planning Center profile, and emails staff a
// completion summary. Only fires when the visitor clicks "Complete My Profile" —
// see the click handler near the end of renderResults().

function buildSurveyPayload(){
  const {norm} = computeGiftScores();
  const disc = discPrimary();
  const mtype = mbtiType();
  const matches = computeMatches();

  return {
    submittedAt: new Date().toISOString(),
    name: S.name,
    email: S.email,
    giftScores: DATA.giftOrder.reduce((acc, g) => {
      acc[g] = Math.round(norm[g] * 100);
      return acc;
    }, {}),
    topGifts: topGifts(norm, 5),
    disc: {letter: disc.letter, counts: disc.counts},
    mbti: {type: mtype},
    topRoles: matches.slice(0, 6).map(m => ({team: m.role.team, score: Math.round(m.score * 100), desc: m.role.desc})),
    schedule: Array.from(S.schedule),
    skills: Array.from(S.skills),
    faithStory: Array.from(S.faithStory),
    under18: S.under18,
    dayJobSkill: S.dayJobSkill,
    volunteerExperience: S.volunteerExperience,
    pastorRequest: S.pastorRequest,
    pastorNote: S.pastorNote,
  };
}

// Returns true on success, false on any failure — the click handler uses this to show
// a real success/error state instead of firing silently.
async function submitToBackend(){
  if (!S.email) return false;
  try {
    const headers = {'Content-Type': 'application/json'};
    if (SURVEY_WEBHOOK_TOKEN) headers['x-webhook-secret'] = SURVEY_WEBHOOK_TOKEN;
    const res = await fetch(SURVEY_BACKEND_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify(buildSurveyPayload()),
    });
    if (!res.ok) {
      console.warn('[survey] backend submission failed:', res.status, await res.text().catch(() => ''));
      return false;
    }
    return true;
  } catch (err) {
    console.warn('[survey] backend submission failed:', err);
    return false;
  }
}

    <div class="type-chip">${disc.letter}</div>
    <p class="small" style="margin-bottom:14px">${DATA.typeBlurbs[disc.letter]}</p>
    <div class="type-chip" style="background:var(--teal-deep)">${mtype}</div>
    <p class="small">This is a light-touch snapshot, not a clinical assessment &mdash; it's here to help color which roles might energize you rather than drain you.</p>
  </div>

  <h2>Roles that fit you well</h2>
  <p class="small" style="margin-bottom:16px">Ranked using your gifts, availability, skills, and personality &mdash; highlighted tags below are the ones that matched.</p>
  ${roleCards}

  <div class="card" id="saveCard">
    <h3>A couple more questions</h3>
    <p class="q-text" style="margin-bottom:6px">If you love your job and you'd like to share those skills with our church community, enter it here:</p>
    <p class="hint" style="margin-top:-4px">e.g. electrician, social media manager, etc.</p>
    <input type="text" id="dayJobInput" placeholder="Your day job or professional skill" value="${S.dayJobSkill}">
    <p class="q-text" style="margin-bottom:6px">Do you have previous volunteer experience that you'd like us to know about?</p>
    <textarea id="volExpInput" placeholder="Optional" style="width:100%;min-height:80px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:var(--font-body);font-size:14.5px;background:#FDFCFA;margin-bottom:8px;resize:vertical">${S.volunteerExperience}</textarea>
  </div>

  <div class="card">
    <h3>Send your results to our team?</h3>
    <p class="small">This opens your email app with your results pre-filled, addressed to our volunteer team &mdash; nothing is sent unless you choose to send that email yourself.</p>
    <input type="text" id="nameInput2" placeholder="Your name" value="${S.name}">
    <input type="email" id="emailInput2" placeholder="Your email" value="${S.email}">
    <div class="pair-opt ${S.pastorRequest ? 'sel' : ''}" id="pastorCheck" style="margin-bottom:${S.pastorRequest ? '10px' : '4px'}">
      <input type="checkbox" id="pastorCheckbox" ${S.pastorRequest ? 'checked' : ''} style="margin-right:8px;vertical-align:middle">
      I discovered something surprising during this and would like to talk this through with a Northshore Pastor.
    </div>
    ${S.pastorRequest ? `
      <textarea id="pastorNote" placeholder="Optional — anything you'd like the pastor to know before you talk" style="width:100%;min-height:80px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:var(--font-body);font-size:14.5px;background:#FDFCFA;margin-bottom:10px;resize:vertical">${S.pastorNote}</textarea>
    ` : ''}
    <a id="sendBtn" href="${buildResultsMailto(topGifts(computeGiftScores().norm, 5), disc, mtype, matches)}" class="btn-primary" style="display:inline-block;text-decoration:none">Email my results to our team &rarr;</a>
  </div>

  <div class="card" id="completeCard">
    <h3>Complete your profile</h3>
    <p class="small">This saves your results to your Northshore volunteer profile and lets our team follow up with you — nothing is saved until you click below.</p>
    <button id="completeProfileBtn" class="btn-primary" style="width:100%">Complete My Profile &rarr;</button>
    <p class="small" id="completeStatus" style="margin-top:10px;margin-bottom:0"></p>
  </div>

  <div class="btnrow">
    <button class="btn-ghost" id="backBtn">&larr; Back</button>
    <button class="btn-ghost" id="restartBtn">Start over</button>
  </div>
  `;

  document.getElementById('dayJobInput').addEventListener('input', e => { S.dayJobSkill = e.target.value; refreshMailtoLink(matches, norm, mtype, disc); });
  document.getElementById('volExpInput').addEventListener('input', e => { S.volunteerExperience = e.target.value; refreshMailtoLink(matches, norm, mtype, disc); });
  document.getElementById('nameInput2').addEventListener('input', e => { S.name = e.target.value; refreshMailtoLink(matches, norm, mtype, disc); });
  document.getElementById('emailInput2').addEventListener('input', e => { S.email = e.target.value; refreshMailtoLink(matches, norm, mtype, disc); });
  document.getElementById('pastorCheckbox').addEventListener('change', e => {
    S.pastorRequest = e.target.checked;
    renderResults();
  });
  document.getElementById('pastorCheck').addEventListener('click', e => {
    if (e.target.id === 'pastorCheckbox') return;
    const cb = document.getElementById('pastorCheckbox');
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  });
  const pastorNoteEl = document.getElementById('pastorNote');
  if (pastorNoteEl) pastorNoteEl.addEventListener('input', e => { S.pastorNote = e.target.value; refreshMailtoLink(matches, norm, mtype, disc); });
  document.getElementById('backBtn').addEventListener('click', () => go(-1));
  document.getElementById('restartBtn').addEventListener('click', () => {
    S.step = 0; S.answers = {}; S.disc = {}; S.mbti = {};
    S.schedule = new Set(); S.skills = new Set(); S.faithStory = new Set();
    S.under18 = null; S.pastorRequest = false; S.pastorNote = "";
    S.dayJobSkill = ""; S.volunteerExperience = "";
    render();
  });

  document.getElementById('completeProfileBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const status = document.getElementById('completeStatus');
    if (!S.email) {
      status.textContent = 'Please enter your email above first.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Completing…';
    status.textContent = '';
    const ok = await submitToBackend();
    if (ok) {
      btn.textContent = 'Profile Completed ✓';
      status.textContent = "You're all set — thanks for taking the time!";
    } else {
      btn.disabled = false;
      btn.textContent = 'Complete My Profile →';
      status.textContent = 'Something went wrong saving your profile. Please try again.';
    }
  });
}

function refreshMailtoLink(matches, norm, mtype, disc){
  const btn = document.getElementById('sendBtn');
  if (btn) btn.href = buildResultsMailto(topGifts(norm, 5), disc, mtype, matches);
}

/* ===================== MAIN RENDER DISPATCH ===================== */
function render(){
  const meta = stepIndexMeta();
  if (meta.kind === 'intro') return renderIntro();
  if (meta.kind === 'gifts') return renderGiftsPage(meta.page);
  if (meta.kind === 'disc') return renderDisc();
  if (meta.kind === 'mbti') return renderMbti();
  if (meta.kind === 'practical') return renderPractical();
  return renderResults();
}

render();

</script>
</body>
</html>
